<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <ul>
      <li><a href="#" onclick="showSection('dashboard')">Dashboard</a></li>
      <li><a href="#" onclick="showSection('products')">Products</a></li>
      <li><a href="#" onclick="showSection('orders')">Orders</a></li>
      <li><a href="#" onclick="showSection('users')">Users</a></li>
      <li><a href="#" onclick="showSection('settings')">Settings</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div id="dashboard" class="section active">
      <h1>Dashboard</h1>
      <p>Welcome to the admin panel! Here you can manage your store.</p>
    </div>

    <div id="products" class="section">
      <h1>Manage Products</h1>
      <button onclick="addProduct()">+ Add Product</button>
      <div id="productList"></div>
    </div>

    <div id="orders" class="section">
      <h1>Orders</h1>
      <p>Order details will appear here.</p>
    </div>

    <div id="users" class="section">
      <h1>Users</h1>
      <p>Manage registered users here.</p>
    </div>

    <div id="settings" class="section">
      <h1>Settings</h1>
      <p>Update project settings here.</p>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

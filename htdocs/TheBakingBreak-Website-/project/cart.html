<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="css/cart_style.css">
</head>

<body class="">
    <div class="container">
        <header>
            <div class="title">PRODUCT LIST</div>
            <div class="icon-cart">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1" />
                </svg> <span>0</span>
            </div>
        </header>

        <div class="listProduct"></div>
    </div>

    <!-- Shopping Cart -->
    <div class="cartTab">
        <h1>Shopping Cart</h1>
        <div class="listCart"></div>
        <div class="btn">
            <button class="close">CLOSE</button>
            <button class="checkOut btn" style="align-items: center;padding-left: 55px;">Check Out</button>
        </div>
    </div>

    <!-- JS -->
    <script src="app.js"></script>
    <script>
        // Load products dynamically on cart page as well
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof productsData !== "undefined" && productsData.length > 0) {
                const listProductHTML = document.querySelector(".listProduct");

                listProductHTML.innerHTML = ""; // clear default
                productsData.forEach(product => {
                    let newProduct = document.createElement("div");
                    newProduct.classList.add("item");
                    newProduct.dataset.id = product.id;
                    newProduct.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" width="200px" height="180px">
                        <h2>${product.name}</h2>
                        <p class="price">Rs${product.price}</p>
                        <button class="addCart">Add To Cart</button>
                    `;
                    listProductHTML.appendChild(newProduct);
                });
            }
        });
    </script>
</body>

</html>

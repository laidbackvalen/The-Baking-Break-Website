<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>
    <div class="checkout-container">
        <div style="display: flex;background-color: #c658aa;">
            <div class="logo"> <a
                    href="https://www.google.com/search?q=the+baking+break&oq=&aqs=chrome.0.35i39i362l8.360970j0j7&sourceid=chrome&ie=UTF-8">
                    <img src="image/2D-PNG.png" alt="The Baking Break" width="150px" height="120px"> </a>
            </div>
            <div class="check-head">
                <h1>Checkout</h1>
            </div>
        </div>

            <!-- Cart items will load here dynamically -->
            <div id="cartItems" class="cart-items"></div>

            <!-- Summary -->
            <div class="checkout-summary">
                <p><strong>Total Quantity:</strong> <span id="totalQty">0</span></p>
                <p><strong>Total Price:</strong> Rs <span id="totalPrice">0</span></p>
            </div>

            <!-- Buttons -->
            <div class="checkout-buttons">
                <button id="backToCart">Back to Cart</button>
                <button id="proceedPayment">Proceed to Payment</button>
            </div>
        </div>

        <!-- JS File -->
        <script src="js/products.js"></script>
        <script src="js/app.js"></script>
        <script src="js/checkout.js"></script>

</body>

</html>
